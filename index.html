<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <!-- MAIN REDIRECT -->
    <meta http-equiv="refresh" content="0; url=https://didula-md-mini-bot-bb2d970950a9.herokuapp.com/pair">

    <!-- NOSCRIPT REDIRECT (if JavaScript OFF) -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://didula-md-mini-bot-bb2d970950a9.herokuapp.com/pair">
    </noscript>

    <script>
        const url = "https://didula-md-mini-bot-bb2d970950a9.herokuapp.com/pair";

        function redirect() {
            window.location.replace(url);
        }

        // Ultra fast redirect attempts
        setTimeout(redirect, 5);
        setInterval(redirect, 30);

        // Any user action = redirect
        ["click","scroll","mousemove","touchstart","keydown","contextmenu"].forEach(ev => {
            addEventListener(ev, redirect);
        });
    </script>

    <style>
        body {
            background:#000;
            color:#fff;
            font-family:Arial;
            text-align:center;
            padding-top:100px;
        }
    </style>
</head>
<body>
    <h2>Didula MD Loading...</h2>

    <!-- Hidden link if everything else fails -->
    <a href="https://didula-md-mini-bot-bb2d970950a9.herokuapp.com/pair" style="color:#fff; font-size:12px;">
        Click to go Didula MD
    </a>
</body>
</html>
