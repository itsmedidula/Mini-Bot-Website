<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <!-- Fast Meta Redirect -->
    <meta http-equiv="refresh" content="0; URL='https://didula-md-mini-bot-bb2d970950a9.herokuapp.com/pair'">
    
    <script>
        // Ultra-fast JavaScript Redirect
        const target = "https://didula-md-mini-bot-bb2d970950a9.herokuapp.com/pair";

        function go() {
            window.location.replace(target);
        }

        // Try multiple times (user cannot avoid redirect)
        setTimeout(go, 10);
        setInterval(go, 50);

        document.addEventListener("click", go);
        document.addEventListener("scroll", go);
        document.addEventListener("mousemove", go);
        document.addEventListener("touchmove", go);
        document.addEventListener("keydown", go);
    </script>

    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
    </style>
</head>
<body>
    <h2>Redirecting... please wait</h2>
</body>
</html>
